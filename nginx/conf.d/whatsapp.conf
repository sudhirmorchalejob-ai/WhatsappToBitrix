server {
        listen 443 ssl http2;
        server_name whatsapp.utkarshmishra.online;
    
        ssl_certificate /etc/letsencrypt/live/whatsapp.utkarshmishra.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/whatsapp.utkarshmishra.online/privkey.pem;
    
        # Frontend Dashboard UI Container
        location / {
            proxy_pass http://whatsapp-frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    
        # Backend REST API & Webhooks Container
        location /api/ {
            proxy_pass http://whatsapp-backend:9191;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /webhooks/ {
            proxy_pass http://whatsapp-backend:9191/webhooks/;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /health {
            proxy_pass http://whatsapp-backend:9191/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
