# Container Nginx Configuration for WhatsApp Frontend Dashboard & Bitrix24 Slider
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for fast loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Single Page Application HTML5 Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets & Font Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # Security Headers (Configured to allow framing within Bitrix24 slider placement)
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
}
