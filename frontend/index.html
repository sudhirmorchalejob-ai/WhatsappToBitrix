<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp By Averlon — Lead Dashboard</title>
    <link rel="icon" type="image/png" href="/WA_logo.png" />
    <script>
      (function () {
        try {
          document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://api.bitrix24.com/api/v1/"></script>
    <script>
      (function () {
        function finishInstall() {
          try {
            if (window.BX24 && typeof window.BX24.installFinish === 'function') {
              window.BX24.installFinish();
            }
          } catch (e) {}
        }
        if (window.BX24 && typeof window.BX24.init === 'function') {
          window.BX24.init(finishInstall);
        } else {
          window.addEventListener('load', function () {
            if (window.BX24 && typeof window.BX24.init === 'function') {
              window.BX24.init(finishInstall);
            }
          });
        }
      })();
    </script>
  </body>
</html>
